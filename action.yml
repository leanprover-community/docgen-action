name: "Documentation generation"
description: "Generates API documentation for your Lean project"
inputs:
  api-docs:
    description: Set to true to build API docs alongside the rest of your documentation. (This is enabled by default but can be disabled if you are only interested in the blueprint.)
    required: false
    default: "true"
  # DEPRECATED: This input will be removed in a future version
  api_docs:
    description: "DEPRECATED: Use api-docs instead"
    required: false
  blueprint:
    description: Set to true to build a blueprint alongside your documentation.
    required: false
    default: "false"
  build-page:
    description: Set to true to build the homepage using Jekyll alongside the rest of your documentation. (This is enabled by default but can be disabled if you are only interested in the API docs and/or blueprint.)
    required: false
    default: "true"
  deploy:
    description: Set to true to deploy the built documentation (API docs and/or blueprint and/or homepage) to GitHub Pages. (This is enabled by default but can be disabled for a dry run.)
    required: false
    default: "true"
  homepage:
    description: The folder where the Jekyll site can be found.
    required: false
    default: "docs"
  build-args:
    description: |
      This GitHub Action uses leanprover/lean-action to build and test the repository.
      This parameter determines what to pass to the build-args argument of leanprover/lean-action.
    required: false
    default: "--log-level=warning"
  # DEPRECATED: This input will be removed in a future version
  build_args:
    description: "DEPRECATED: Use build-args instead"
    required: false
  lake-package-directory:
    description: |
      The directory containing the Lake package to build.
      This parameter is passed to the lake-package-directory argument of leanprover/lean-action.
    required: false
    default: "."
  # DEPRECATED: This input will be removed in a future version
  lake_package_directory:
    description: "DEPRECATED: Use lake-package-directory instead"
    required: false
  references:
    description: Path to a BibTeX (.bib) file used for generating the references page and link formatting.
    required: false
    default: "references.bib"
  use-github-cache:
    description: Whether to use the GitHub Actions cache to accelerate the build. Defaults to true.
    required: false
    default: "true" # Use string instead of boolean for consistency with lean-action
runs:
  using: "composite"
  steps:
    # DEPRECATION HANDLER STEP - Remove this step when dropping deprecation support
    - name: Handle deprecation and set environment variables
      id: deprecation
      run: node "${{ github.action_path }}/dist/deprecation.js"
      shell: bash
      env:
        INPUT_API-DOCS: ${{ inputs.api-docs }}
        INPUT_API_DOCS: ${{ inputs.api_docs }}
        INPUT_BUILD-ARGS: ${{ inputs.build-args }}
        INPUT_BUILD_ARGS: ${{ inputs.build_args }}
        INPUT_LAKE-PACKAGE-DIRECTORY: ${{ inputs.lake-package-directory }}
        INPUT_LAKE_PACKAGE_DIRECTORY: ${{ inputs.lake_package_directory }}

    - name: Parse the project metadata.
      id: determine-project-metadata
      run: node "${{ github.action_path }}/dist/index.js"
      shell: bash
      # TODO: When dropping deprecation support, change this back to: working-directory: ${{ inputs.lake-package-directory }}
      working-directory: ${{ env.LAKE_PACKAGE_DIRECTORY }}

    - name: Cache Mathlib docs
      # With the current setup, this condition should always be true (except for Lean itself perhaps).
      # However, if it turns out false that just means we have nothing to cache,
      # and so we skip the caching step, instead of erroring due to an empty `path` input.
      # TODO: When dropping deprecation support, change this back to: inputs.api-docs == 'true'
      if: |
        inputs.use-github-cache == 'true' &&
        github.event_name == 'push' && env.API_DOCS == 'true' &&
          steps.determine-project-metadata.outputs.cached_docbuild_dependencies != ''
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.determine-project-metadata.outputs.cached_docbuild_dependencies }}
        key: Docs-${{ hashFiles('lake-manifest.json', inputs.references) }}

    - name: Check for ${{ inputs.homepage }} folder # this is meant to detect a Jekyll-based website
      id: check_docs
      if: inputs.build-page == 'true'
      run: |
        if [ -d ${{ inputs.homepage }} ]; then
          echo "The '${{ inputs.homepage }}' folder exists in the repository."
          echo "DOCS_EXISTS=true" >> $GITHUB_ENV
        else
          echo "The '${{ inputs.homepage }}' folder does not exist in the repository."
          echo "DOCS_EXISTS=false" >> $GITHUB_ENV
        fi
      shell: bash

    - name: Build blueprint and copy to `${{ inputs.homepage }}/blueprint`
      if: inputs.blueprint == 'true'
      uses: xu-cheng/texlive-action@f886de8159e5952a131848a5fa9c3196a2132b5d # v2
      with:
        docker_image: ghcr.io/xu-cheng/texlive-full:20250401
        run: |
          # Install necessary dependencies and build the blueprint
          apk update
          apk add --update make py3-pip git pkgconfig graphviz graphviz-dev gcc musl-dev
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global --add safe.directory `pwd`
          python3 -m venv env
          source env/bin/activate
          pip install --upgrade pip requests wheel
          pip install pygraphviz --config-settings="--global-option=build_ext" --config-settings="--global-option=-L/usr/lib/graphviz/" --config-settings="--global-option=-R/usr/lib/graphviz/"
          pip install leanblueprint
          leanblueprint pdf
          mkdir -p ${{ inputs.homepage }}
          cp blueprint/print/print.pdf ${{ inputs.homepage }}/blueprint.pdf
          leanblueprint web
          cp -r blueprint/web ${{ inputs.homepage }}/blueprint

    - name: Check declarations mentioned in the blueprint exist in Lean code
      if: inputs.blueprint == 'true'
      run: ~/.elan/bin/lake exe checkdecls blueprint/lean_decls
      shell: bash

    - name: Build project API documentation
      # TODO: When dropping deprecation support, change this back to: inputs.api-docs == 'true'
      if: github.event_name == 'push' && env.API_DOCS == 'true'
      run: ${{ github.action_path }}/scripts/build_docs.sh
      shell: bash
      env:
        NAME: ${{ steps.determine-project-metadata.outputs.name }}
        DOCS_FACETS: ${{ steps.determine-project-metadata.outputs.docs_facets }}
        HOMEPAGE: ${{ inputs.homepage }}
        REFERENCES: ${{ inputs.references }}

    - name: Bundle dependencies
      id: bundle
      if: github.event_name == 'push' && inputs.build-page == 'true' && env.DOCS_EXISTS == 'true'
      uses: ruby/setup-ruby@eaecf785f6a34567a6d97f686bbb7bccc1ac1e5c # v1.237.0
      with:
        working-directory: ${{ inputs.homepage }}
        ruby-version: "3.4" # Specify Ruby version
        bundler-cache: true # Enable caching for bundler

    - name: Diagnose the failed bundle install
      id: diagnose-bundle-failure
      if: ${{ !cancelled() && steps.bundle.outcome == 'failure' }}
      working-directory: ${{ inputs.homepage }}
      env:
        JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        # `bundle install` failed. Find out whether a refreshed Gemfile.lock
        # fixes it: reproduce the failure with the committed lockfile, relock,
        # install, and rebuild the site. Every command runs in (or installs
        # into) a scratch directory, so the workspace and the build do not
        # change. The step itself succeeds so the diagnosis is not reported
        # as a second failure; the run stays red because `bundle` failed.
        summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
        tail_to_summary() {
          summary '```'
          tail -n 15 "$1" >> "$GITHUB_STEP_SUMMARY"
          summary '```'
        }
        summary '## `bundle install` failed: diagnosis'
        if ! command -v bundle >/dev/null 2>&1; then
          summary 'Ruby was not installed, so the failure comes before `bundle install`. Check the Ruby version and the setup-ruby log.'
          exit 0
        fi
        if [ ! -f Gemfile ]; then
          summary 'There is no `Gemfile` in `${{ inputs.homepage }}`, so the diagnosis cannot run. Check the setup-ruby log.'
          exit 0
        fi
        scratch="$(mktemp -d)"
        # Isolate from the .bundle/config that setup-ruby wrote before it failed.
        export BUNDLE_APP_CONFIG="$scratch/.bundle"
        export BUNDLE_PATH="$scratch/vendor"
        cp Gemfile "$scratch/"
        for f in Gemfile.lock .ruby-version .tool-versions mise.toml; do
          if [ -f "$f" ]; then cp "$f" "$scratch/"; fi
        done
        ruby_desc="$(ruby -e 'print RUBY_DESCRIPTION')"

        echo '::group::Reproduce with the committed Gemfile.lock'
        if (cd "$scratch" && bundle install 2>&1 | tee reproduce.log); then
          echo '::endgroup::'
          summary "A second \`bundle install\` with the committed \`Gemfile.lock\` succeeded on this runner ($ruby_desc)."
          summary 'The first failure looks transient (for example a network error). Re-run the job.'
          exit 0
        fi
        echo '::endgroup::'

        echo '::group::Refresh the lockfile'
        if ! (cd "$scratch" && bundle lock --update --add-platform x86_64-linux aarch64-linux 2>&1 | tee lock.log); then
          echo '::endgroup::'
          summary 'The failure reproduces, and dependency resolution fails even without the lockfile pins.'
          summary 'A refreshed lockfile does not fix this. Last lines of `bundle lock --update`:'
          tail_to_summary "$scratch/lock.log"
          exit 0
        fi
        echo '::endgroup::'

        echo '::group::Install with the refreshed Gemfile.lock'
        if ! (cd "$scratch" && bundle install 2>&1 | tee install.log); then
          echo '::endgroup::'
          summary 'The failure reproduces, and `bundle install` fails with a refreshed lockfile too.'
          summary 'This does not look like a lockfile problem. Last lines:'
          tail_to_summary "$scratch/install.log"
          exit 0
        fi
        echo '::endgroup::'

        echo '::group::Build the site with the refreshed Gemfile.lock'
        built=true
        if ! BUNDLE_GEMFILE="$scratch/Gemfile" JEKYLL_ENV=production \
            bundle exec jekyll build --destination "$scratch/_site" 2>&1 | tee "$scratch/build.log"; then
          built=false
        fi
        echo '::endgroup::'

        mkdir -p "$scratch/artifact"
        cp "$scratch/Gemfile.lock" "$scratch/artifact/Gemfile.lock"
        echo "artifact-dir=$scratch/artifact" >> "$GITHUB_OUTPUT"
        echo "upload=true" >> "$GITHUB_OUTPUT"
        ruby_ver="$(ruby -e 'print RUBY_VERSION')"
        summary 'The `bundle install` failure reproduces with the committed `Gemfile.lock` and goes away with a refreshed one.'
        summary 'The refreshed `Gemfile.lock` is attached to this run as the `refreshed-Gemfile.lock` artifact.'
        summary ''
        if [ "$built" = true ]; then
          summary "Verification on this runner ($ruby_desc): \`bundle install\` succeeds and Jekyll builds the site with the refreshed lockfile. Two ways to fix the build:"
          summary '1. Download the artifact and commit the file as `${{ inputs.homepage }}/Gemfile.lock`. (Or run `bundle lock --update --add-platform x86_64-linux` on the same Ruby version and commit the result.)'
          summary '2. Keep the current lockfile and set the `ruby-version` input of this action to a Ruby version that the lockfile supports. The `bundle install` error in the job log names the requirement.'
          echo "::error::bundle install failed with the committed ${{ inputs.homepage }}/Gemfile.lock, but succeeds with a refreshed lockfile on Ruby $ruby_ver. Fix: commit the refreshed-Gemfile.lock artifact from this run, or set the action's ruby-version input to a version that the current lockfile supports. Details in the run summary."
        else
          summary 'However, `jekyll build` fails with the refreshed lockfile, so the refreshed lockfile alone does not fix the build. Last lines of `jekyll build`:'
          tail_to_summary "$scratch/build.log"
          summary 'Either update the site for the newer gem versions and commit the refreshed lockfile together with those changes, or keep the current lockfile and set the `ruby-version` input of this action to a Ruby version that the lockfile supports. The `bundle install` error in the job log names the requirement.'
          echo "::error::bundle install failed with the committed ${{ inputs.homepage }}/Gemfile.lock. A refreshed lockfile repairs the install on Ruby $ruby_ver, but jekyll build then fails, so the refreshed lockfile alone does not fix the build. Details and options in the run summary."
        fi

    - name: Upload the refreshed Gemfile.lock
      if: ${{ !cancelled() && steps.diagnose-bundle-failure.outputs.upload == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: refreshed-Gemfile.lock
        path: ${{ steps.diagnose-bundle-failure.outputs.artifact-dir }}

    - name: Build website using Jekyll
      if: github.event_name == 'push' && inputs.build-page == 'true' && env.DOCS_EXISTS == 'true'
      working-directory: ${{ inputs.homepage }}
      env:
        JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      run: JEKYLL_ENV=production bundle exec jekyll build # Note this will also copy the blueprint and API doc into ${{ inputs.homepage }}/_site
      shell: bash

    - name: "Upload website (API documentation, blueprint and any home page)"
      if: github.event_name == 'push' && inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: ${{ env.DOCS_EXISTS == 'true' && format('{0}/_site', inputs.homepage) || format('{0}/', inputs.homepage) }}

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && inputs.deploy == 'true'
      id: deployment
      uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
