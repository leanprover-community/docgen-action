name: Documentation cache regression

on:
  pull_request:
    paths:
      - "scripts/**"
      - "src/**"
      - "dist/**"
      - "test/**"
      - "package*.json"
      - "action.yml"
      - ".github/workflows/cache-restore-test.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-cache-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: test/fixtures/cache-restore
          build: false
          test: false
          lint: false
          use-github-cache: false
      - run: npm run test:cache-restore
